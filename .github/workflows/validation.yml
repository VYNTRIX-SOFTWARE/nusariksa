name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Periksa kode dan pengujian
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nusariksa
          POSTGRES_PASSWORD: temporary-test-password
          POSTGRES_DB: nusariksa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nusariksa -d nusariksa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://nusariksa:temporary-test-password@127.0.0.1:5432/nusariksa_test

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4
      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Pasang dependensi
        run: npm ci --ignore-scripts
      - name: Jalankan migrasi database
        run: npm run db:migrate
      - name: Jalankan pemeriksaan
        run: npm run check
